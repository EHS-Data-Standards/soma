---
name: Publish Python Package

# Publishes with trusted publishing to PyPI on releases created in
# GitHub UI if status is published. For draft status, nothing happens.
#
# More on trusted publishing: https://docs.pypi.org/trusted-publishers/

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build Python 🐍 distributions 📦 for publishing
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13
          enable-cache: true

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.13

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Build source and wheel archives
        run: uv build

      # https://github.com/actions/upload-artifact
      - name: Store built distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distribution-files
          path: dist/

  pypi-publish:
    name: Publish Python 🐍 package 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/p/soma-schema
    permissions:
      id-token: write  # this permission is mandatory for trusted publishing
    steps:
      # https://github.com/actions/download-artifact
      - name: Download built distribution
        uses: actions/download-artifact@v8.0.1
        with:
          name: distribution-files
          path: dist

      # https://github.com/pypa/gh-action-pypi-publish
      - name: Publish package 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          verbose: true

# Used actions: (updates managed by dependabot)
# - https://github.com/actions/checkout
# - https://github.com/astral-sh/setup-uv
# - https://github.com/actions/setup-python
# - https://github.com/actions/upload-artifact
# - https://github.com/actions/download-artifact
# - https://github.com/pypa/gh-action-pypi-publish/
