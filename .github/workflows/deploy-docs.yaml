---
name: Deploy docs
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a gh-pages deployment
    permissions:
      contents: write  # to let mkdocs write the new docs
      pages: write     # to deploy to Pages
      id-token: write  # allow to generate an OpenID Connect (OIDC) token

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # otherwise, you will fail to push refs to dest repo

      - name: Configure git for the bot
        # Gives the bot that commits to gh-pages a name & email address
        # so that the commits have an author in the commit log.
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: 3.13
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.13

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install dependencies
        run: uv sync --dev --no-progress

      - name: Install SQLite for diagram generation
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Generate project artifacts
        run: just gen-project

      - name: Build DataHarmonizer and documentation
        run: |
          just gen-doc
          npm install
          npm run build
          cp -r dist/assets docs/
          cp dist/index.html docs/harmonizer.html
          sed -i 's|"/assets/|"assets/|g' docs/harmonizer.html
          mkdir -p docs/schemas
          uv run gen-linkml --materialize-patterns --materialize-attributes src/soma/schema/soma.yaml > docs/schemas/soma.json
          cp menu.json docs/
          uv run mkdocs gh-deploy
