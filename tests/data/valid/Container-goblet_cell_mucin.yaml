      - protocol_type: StainingProtocol
        id: "PROTOCOL:stain-001"
        name: "AB-PAS staining for goblet cells"
        staining_type: "AB-PAS"
        fixation_method: "4% paraformaldehyde"
        counterstain: "hematoxylin"

# Analysis layer: goblet cell percentage is a percentage measurement, so its
# change is an absolute difference in percentage points; MUC5AC mRNA is
# already a fold change.
response_comparisons:
  - id: "COMP:GCM001-goblet-percentage"
    name: "Change in goblet cell percentage, IL-13 vs vehicle"
    derived_from_assay: "GCM:001"
    compared_measurement: "goblet_cell_percentage"
    control_output: "GCM:001-output-control"
    treated_output: "GCM:001-output-il13"
    change_type: absolute_difference
    change_direction: increased
    change_value:
      value: "19"
      unit:
        id: "UO:0000187"
        name: "percent"
    p_value: 0.001
    statistical_test: "two-sample t-test"
    derivation: computed
  - id: "COMP:GCM001-muc5ac-mrna"
    name: "Change in MUC5AC mRNA expression, IL-13 vs vehicle"
    derived_from_assay: "GCM:001"
    compared_measurement: "muc5ac_mrna_expression"
    control_output: "GCM:001-output-control"
    treated_output: "GCM:001-output-il13"
    change_type: fold_change
    change_direction: increased
    change_value:
      value: "4.8"
      unit:
        id: "STATO:0000169"
        name: "fold change"
    p_value: 0.0004
    statistical_test: "two-sample t-test"
    derivation: reported_in_paper
