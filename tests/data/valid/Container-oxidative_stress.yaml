        eight_ohdg_level:
          value: "12.5"
          unit:
            id: "UO:0000275"
            name: "nanogram per milligram creatinine"
          central_tendency: mean
          sample_size: 6
        superoxide_dismutase_activity:
          value: "0.75"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        catalase_activity:
          value: "0.82"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        nrf2_activation:
          value: "2.8"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        protein_oxidation_markers:
          - "carbonyl"
          - "nitrotyrosine"
