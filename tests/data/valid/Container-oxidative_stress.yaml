    ros_probe_type: "DCFDA"
    assay_date: "2024-01-20"
    informs_on_key_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    study_subject:
      subject_type: CellularSystem
      id: "soma:culture-003"
      name: "Primary HBE ALI culture"
      cell_type:
        id: "CL:0002328"
        name: "bronchial epithelial cell"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
    follows_protocols:
      - protocol_type: MolecularAssayProtocol
        id: "PROTOCOL:ros-001"
        name: "DCFDA ROS detection in ALI cultures"
        detection_method: "fluorescence plate reader"
        normalization_method: "cell count normalization"

# Analysis layer: MDA is measured in its own unit, so its change relative to
# control is an absolute difference; ROS is already reported as fold change.
response_comparisons:
  - id: "COMP:OX001-ros"
    name: "Change in reactive oxygen species, PM2.5 vs vehicle"
    derived_from_assay: "OX:001"
    compared_measurement: "reactive_oxygen_species"
    control_output: "OX:001-output-control"
    treated_output: "OX:001-output-pm25"
    change_type: fold_change
    change_direction: increased
    change_value:
      value: "2.5"
      unit:
        id: "STATO:0000169"
        name: "fold change"
    p_value: 0.001
    statistical_test: "two-sample t-test"
    derivation: reported_in_paper
  - id: "COMP:OX001-mda"
    name: "Change in malondialdehyde level, PM2.5 vs vehicle"
    derived_from_assay: "OX:001"
    compared_measurement: "malondialdehyde_level"
    control_output: "OX:001-output-control"
    treated_output: "OX:001-output-pm25"
    change_type: absolute_difference
    change_direction: increased
    change_value:
      value: "1.8"
      unit:
        id: "UO:0000063"
        name: "nanomole per milligram protein"
    p_value: 0.003
    statistical_test: "two-sample t-test"
    derivation: computed
