# Test file for OxidativeStressAssay
# Demonstrates per-condition outputs: a vehicle control record that anchors
# the fold-change scale at 1.0 and a PM2.5-exposed record, each linked to its
# exposure condition via measured_under.
oxidative_stress_assays:
  - id: "OX:001"
    name: "ROS level after PM2.5 exposure"
    has_exposure_condition:
      - id: "EXPOSURE:ox-vehicle-24h"
        name: "Culture medium vehicle 24 hours (control)"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
        timing_post_exposure:
          value: "0"
          unit:
            id: "UO:0000032"
            name: "hour"
      - id: "EXPOSURE:pm25-24h"
        name: "PM2.5 10 ug/cm2 for 24 hours"
        exposure_agent:
          id: "CHEBI:74481"
          name: "PM2.5"
        exposure_concentration:
          value: "10"
          unit:
            id: "UO:0000274"
            name: "microgram per square centimeter"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
        timing_post_exposure:
          value: "0"
          unit:
            id: "UO:0000032"
            name: "hour"
    has_specified_output:
      - id: "OX:001-output-control"
        name: "Vehicle control oxidative stress measurements"
        experimental_group: vehicle_control
        measured_under: "EXPOSURE:ox-vehicle-24h"
        reactive_oxygen_species:
          value: "1.0"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        lipid_peroxidation:
          value: "1.0"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        malondialdehyde_level:
          value: "1.4"
          unit:
            id: "UO:0000063"
            name: "nanomole per milligram protein"
          central_tendency: mean
          sample_size: 6
          variability:
            variability_type: standard_deviation
            value: "0.3"
            unit:
              id: "UO:0000063"
              name: "nanomole per milligram protein"
        protein_carbonyl_content:
          value: "0.9"
          unit:
            id: "UO:0000063"
            name: "nanomole per milligram protein"
          central_tendency: mean
          sample_size: 6
        glutathione_ratio:
          value: "0.95"
          unit:
            id: "UO:0000190"
            name: "ratio"
          central_tendency: mean
          sample_size: 6
        eight_ohdg_level:
          value: "4.1"
          unit:
            id: "UO:0000275"
            name: "nanogram per milligram creatinine"
          central_tendency: mean
          sample_size: 6
        superoxide_dismutase_activity:
          value: "1.0"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        catalase_activity:
          value: "1.0"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        nrf2_activation:
          value: "1.0"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        protein_oxidation_markers:
          - "carbonyl"
          - "nitrotyrosine"
        antioxidant_enzyme_activities: "SOD, catalase, GPx measured"
      - id: "OX:001-output-pm25"
        name: "PM2.5-exposed oxidative stress measurements"
        experimental_group: treated
        measured_under: "EXPOSURE:pm25-24h"
        reactive_oxygen_species:
          value: "2.5"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
          variability:
            variability_type: standard_deviation
            value: "0.35"
            unit:
              id: "STATO:0000169"
              name: "fold change"
        lipid_peroxidation:
          value: "1.8"
          unit:
            id: "STATO:0000169"
            name: "fold change"
          central_tendency: mean
          sample_size: 6
        malondialdehyde_level:
          value: "3.2"
          unit:
            id: "UO:0000063"
            name: "nanomole per milligram protein"
          central_tendency: mean
          sample_size: 6
          variability:
            variability_type: standard_deviation
            value: "0.5"
            unit:
              id: "UO:0000063"
