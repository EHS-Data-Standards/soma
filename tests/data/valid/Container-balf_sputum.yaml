# Test file for BALFSputumAssay (in vivo only)
# This assay is IN VIVO ONLY (supported_contexts: in_vivo_only)
# Samples must come from a living organism.
#
# Demonstrates per-condition outputs for a repeated-measures design: the same
# subject is sampled before exposure (experimental_group: baseline) and again
# after a controlled ozone exposure (experimental_group: treated), so the two
# records differ only in which exposure condition they were measured under.
balf_sputum_assays:
  - id: "BALF:001"
    name: "Sputum cell differential before and after controlled ozone exposure"
    has_exposure_condition:
      - id: "EXPOSURE:balf-filtered-air-2h"
        name: "Filtered air 2 hours (pre-exposure baseline visit)"
        exposure_duration:
          value: "2"
          unit:
            id: "UO:0000032"
            name: "hour"
      - id: "EXPOSURE:balf-ozone-300ppb-2h"
        name: "Ozone 0.3 ppm for 2 hours with intermittent exercise"
        exposure_agent:
          id: "CHEBI:25812"
          name: "ozone"
        exposure_concentration:
          value: "300"
          unit:
            id: "UO:0000169"
            name: "parts per billion"
        exposure_duration:
          value: "2"
          unit:
            id: "UO:0000032"
            name: "hour"
        timing_post_exposure:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
    has_specified_output:
      - id: "BALF:001-output-baseline"
        name: "Pre-exposure baseline sputum measurements"
        experimental_group: baseline
        measured_under: "EXPOSURE:balf-filtered-air-2h"
        neutrophil_percentage:
          value: "24.0"
          unit:
            id: "UO:0000187"
            name: "percent"
          central_tendency: single_value
          sample_size: 1
        il8_concentration:
          value: "95"
          unit:
            id: "UO:0000175"
            name: "picogram per milliliter"
          central_tendency: single_value
          sample_size: 1
        eosinophil_percentage:
          value: "3.1"
          unit:
            id: "UO:0000187"
            name: "percent"
          central_tendency: single_value
          sample_size: 1
        macrophage_percentage:
          value: "58.0"
          unit:
            id: "UO:0000187"
            name: "percent"
          central_tendency: single_value
          sample_size: 1
        lymphocyte_percentage:
          value: "14.9"
          unit:
            id: "UO:0000187"
            name: "percent"
          central_tendency: single_value
          sample_size: 1
        total_cell_count:
          value: "1400000"
          unit:
            id: "UO:0000209"
            name: "cells per milliliter"
          central_tendency: single_value
          sample_size: 1
        il6_concentration:
          value: "32"
