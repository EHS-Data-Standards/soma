            id: "UO:0000175"
            name: "picogram per milliliter"
          central_tendency: single_value
          sample_size: 1
        total_protein_concentration:
          value: "0.7"
          unit:
            id: "UO:0000176"
            name: "milligram per milliliter"
          central_tendency: single_value
          sample_size: 1
      - id: "BALF:001-output-ozone"
        name: "24-hour post-ozone sputum measurements"
        experimental_group: treated
        measured_under: "EXPOSURE:balf-ozone-300ppb-2h"
        neutrophil_percentage:
          value: "45.0"
          unit:
            id: "UO:0000187"
            name: "percent"
          central_tendency: single_value
          sample_size: 1
        il8_concentration:
          value: "250"
