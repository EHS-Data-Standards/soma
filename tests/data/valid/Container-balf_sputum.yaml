      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    target_cell_type:
      id: "CL:0000775"
      name: "neutrophil"
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:001"
      name: "Subject A"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      age:
        value: "45"
        unit:
          id: "UO:0000036"
          name: "year"
      sex: "female"
      sample_type: sputum
      collection_site: "pulmonary clinic"
      subject_characteristics: "Non-smoker, mild asthma"
      sample_collection_method: "Induced sputum with hypertonic saline nebulization"
      clinical_context: "Controlled ozone exposure study, stable asthma at enrollment"
    follows_protocols:
      - protocol_type: MolecularAssayProtocol
        id: "PROTOCOL:balf-001"
        name: "Sputum cell differential protocol"
        detection_method: "cytospin and Diff-Quik staining"

# Analysis layer: within-subject changes from the pre-exposure baseline. Cell
# differentials are percentages, so their change is an absolute difference in
# percentage points; IL-8 is expressed as a percent change from baseline.
response_comparisons:
  - id: "COMP:BALF001-neutrophil-percentage"
    name: "Change in sputum neutrophil percentage, post-ozone vs baseline"
    derived_from_assay: "BALF:001"
    compared_measurement: "neutrophil_percentage"
    control_output: "BALF:001-output-baseline"
    treated_output: "BALF:001-output-ozone"
    change_type: absolute_difference
    change_direction: increased
    change_value:
      value: "21.0"
      unit:
        id: "UO:0000187"
        name: "percent"
    derivation: computed
  - id: "COMP:BALF001-il8"
    name: "Change in sputum IL-8 concentration, post-ozone vs baseline"
    derived_from_assay: "BALF:001"
    compared_measurement: "il8_concentration"
    control_output: "BALF:001-output-baseline"
    treated_output: "BALF:001-output-ozone"
    change_type: percent_change
    change_direction: increased
    change_value:
      value: "163.2"
      unit:
        id: "UO:0000187"
        name: "percent"
    derivation: computed
