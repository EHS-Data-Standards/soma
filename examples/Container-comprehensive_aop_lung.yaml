# =============================================================================
# RESPONSE COMPARISONS (Analysis Layer)
# =============================================================================
#
# Every step of this pathway compares a clean-air control against a PM2.5
# exposure. The control and exposed groups are written as separate assay
# records here because each was run and reported separately, so each
# comparison references one output record from each assay - the change itself
# is never stored inside the assay data.

response_comparisons:
  # MIE: oxidative stress
  - id: "COMP:aop-ros-4h"
    name: "Change in ROS, PM2.5 vs clean air (4h)"
    description: "Cross-assay comparison between the control assay OX:001 and the exposed assay OX:002."
    derived_from_assay: "OX:002"
    compared_measurement: "reactive_oxygen_species"
    control_output: "OX:001-output-control"
    treated_output: "OX:002-output-pm25"
    change_type: fold_change
    change_direction: increased
    change_value:
      value: "2.8"
      unit:
        id: "STATO:0000169"
        name: "fold change"
    p_value: 0.001
    statistical_test: "two-sample t-test"
    derivation: reported_in_paper

  # KE1: EGFR activation
  - id: "COMP:aop-pegfr-4h"
    name: "Change in EGFR Y1068 phosphorylation, PM2.5 vs clean air (4h)"
    description: "Cross-assay comparison between the control assay EGFR:001 and the exposed assay EGFR:002."
    derived_from_assay: "EGFR:002"
    compared_measurement: "egfr_phosphorylation_y1068"
    control_output: "EGFR:001-output-control"
    treated_output: "EGFR:002-output-pm25"
    change_type: fold_change
    change_direction: increased
    change_value:
      value: "3.5"
      unit:
        id: "STATO:0000169"
        name: "fold change"
    p_value: 0.002
    statistical_test: "two-sample t-test"
    derivation: reported_in_paper

  # KE2: goblet cell hyperplasia
  - id: "COMP:aop-muc5ac-24h"
    name: "Change in MUC5AC mRNA, PM2.5 vs clean air (24h)"
    description: "Cross-assay comparison between the control assay GCM:001 and the exposed assay GCM:002."
    derived_from_assay: "GCM:002"
    compared_measurement: "muc5ac_mrna_expression"
    control_output: "GCM:001-output-control"
    treated_output: "GCM:002-output-pm25"
    change_type: fold_change
    change_direction: increased
    change_value:
      value: "4.2"
      unit:
        id: "STATO:0000169"
        name: "fold change"
    p_value: 0.001
    statistical_test: "two-sample t-test"
    derivation: reported_in_paper

  # KE3 (part 1): ciliary function
  - id: "COMP:aop-cbf-7d"
    name: "Change in ciliary beat frequency, PM2.5 7d vs clean air baseline"
    description: "Cross-assay comparison between the control assay CILIARY:001 and the exposed assay CILIARY:003."
    derived_from_assay: "CILIARY:003"
    compared_measurement: "beat_frequency_hz"
    control_output: "CILIARY:001-output-control"
    treated_output: "CILIARY:003-output-pm25"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-5.3"
      unit:
        id: "UO:0000106"
        name: "hertz"
    p_value: 0.001
    statistical_test: "two-sample t-test"
    derivation: computed

  # KE3 (part 2): mucociliary clearance
  - id: "COMP:aop-mct-7d"
    name: "Change in mucociliary transport rate, PM2.5 7d vs clean air baseline"
    description: "Cross-assay comparison between the control assay MCC:001 and the exposed assay MCC:003."
    derived_from_assay: "MCC:003"
    compared_measurement: "transport_rate"
    control_output: "MCC:001-output-control"
    treated_output: "MCC:003-output-pm25"
    change_type: percent_change
    change_direction: decreased
    change_value:
      value: "-65.4"
      unit:
        id: "UO:0000187"
        name: "percent"
    p_value: 0.001
    statistical_test: "two-sample t-test"
    derivation: computed

  # AO: lung function decline
  - id: "COMP:aop-fev1-1yr"
    name: "Change in FEV1 over 1 year of continued ambient PM2.5 exposure"
    description: "Within-subject comparison: LF:001 is the enrollment measurement and LF:002 the 1-year follow-up for the same subject."
    derived_from_assay: "LF:002"
    compared_measurement: "fev1"
    control_output: "LF:001-output-baseline"
    treated_output: "LF:002-output-followup"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-4"
