name: assay_base
description: >-
  Base schema defining the Assay interface and supporting classes (Protocol,
  Method) for outcomes research. Domain-specific assay microschemas extend
  this base to define assays with named measurement slots.
title: Assay Base Schema
id: https://w3id.org/EHS-Data-Standards/assay_base

imports:
  - linkml:types
  - aop_framework

prefixes:
  assay_base: https://w3id.org/EHS-Data-Standards/assay_base/
  linkml: https://w3id.org/linkml/
  OBI: http://purl.obolibrary.org/obo/OBI_
  UO: http://purl.obolibrary.org/obo/UO_
  IAO: http://purl.obolibrary.org/obo/IAO_
  PATO: http://purl.obolibrary.org/obo/PATO_
  CLO: http://purl.obolibrary.org/obo/CLO_
  NAMO: http://purl.obolibrary.org/obo/NAMO_
  EFO: http://www.ebi.ac.uk/efo/EFO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  GO: http://purl.obolibrary.org/obo/GO_
  CL: http://purl.obolibrary.org/obo/CL_
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  PR: http://purl.obolibrary.org/obo/PR_
  STATO: http://purl.obolibrary.org/obo/STATO_
  schema: http://schema.org/
  aop_framework: https://w3id.org/EHS-Data-Standards/aop_framework/
  UCUM: http://unitsofmeasure.org/
  QUDT: http://qudt.org/vocab/unit/
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  owg: https://w3id.org/EHS-Data-Standards/soma/

default_prefix: assay_base
default_range: string

# =============================================================================
# CLASSES
# =============================================================================

classes:

  # ---------------------------------------------------------------------------
  # Core Assay Class (Abstract Base)
  # ---------------------------------------------------------------------------

  Assay:
    is_a: NamedThing
    abstract: true
    class_uri: OBI:0000070
    description: >-
      A planned process with the objective to produce information about
      biological state relevant to a Key Event in an Adverse Outcome Pathway.
      Assays are organized by the functional domain they assess (e.g., ciliary
      function, oxidative stress), and each domain-specific assay class contains
      named slots for the specific measurements it can produce. Assays inform on
      key events and contain the measurement data as named slots.
    slots:
      - informs_on_key_event
      - study_subject
      - has_exposure_condition
      - follows_protocols
      - has_specified_output
      - assay_date

  # ---------------------------------------------------------------------------
  # Assay Output Measurement (Abstract Base)
  # ---------------------------------------------------------------------------

  AssayOutputMeasurement:
    is_a: NamedThing
    abstract: true
    exact_mappings:
      - IAO:0000109
    description: >-
      The measurement results produced by an assay. The specified output
      of a planned process. Each domain-specific assay class has a
      corresponding AssayOutputMeasurement subclass containing the named
      measurement slots for that assay type. This class represents the "output" in the Input/Process/Output
      model: what was measured and what values were obtained.

      One AssayOutputMeasurement record represents the results for ONE
      experimental condition or group. When a study reports a control group
      and one or more treated groups (or a dose-response series), each group
      gets its own output record, marked with experimental_group and linked
      to the specific exposure condition via measured_under.
    slots:
      - experimental_group
      - measured_under

  # ---------------------------------------------------------------------------
  # Study Subject Hierarchy
  # ---------------------------------------------------------------------------

  StudySubject:
    is_a: NamedThing
    description: >-
      The subject of a study — what the assay is performed on. Subclasses
      capture different experimental contexts (model systems, living subjects,
      populations) with context-appropriate slots. The type of subject
      determines which slots are available, replacing the old mixin pattern.
    slots:
      - subject_type
      - model_species

  ModelSystem:
    is_a: StudySubject
    description: >-
      An in vitro or ex vivo model system used to study biological processes.
      Parent class for cell-based and other model systems.

  InVivoSubject:
    is_a: StudySubject
    description: >-
      A living human or animal subject from whom measurements are taken.
      Used for clinical assays (lung function, BALF/sputum) and any assay
      performed on living subjects.
    slots:
      - age
      - sex
      - subject_characteristics
      - disease_state
      - sample_type
      - collection_site
      - collection_date
      - sample_collection_method
      - clinical_context

  PopulationSubject:
    is_a: StudySubject
    description: >-
      A population or cohort of subjects studied in aggregate. Used for
      epidemiological or population-level analyses. Can optionally hold
      references to individual InVivoSubject members.
    slots:
      - cohort_size
      - inclusion_criteria
      - age_range
      - subjects

  # ---------------------------------------------------------------------------
  # Protocol Classes
  # ---------------------------------------------------------------------------

  Protocol:
    is_a: NamedThing
    class_uri: OBI:0000272
    description: >-
      A detailed set of steps for how to perform a specific assay.
      Protocols ensure reproducibility across laboratories.
      Contains universal slots; domain-specific details are in protocol
      subclasses (ImagingProtocol, StainingProtocol, etc.). Protocols can reference other protocols via sub_protocols to represent
      composite workflows (e.g., sample preparation, wash steps, or
      post-processing protocols that are shared across assays).
    slots:
      # Type designator for polymorphism
      - protocol_type
      - protocol_version
      - equipment_required
      - sub_protocols
      - quality_control_criteria
      - replicate_requirements
      - protocol_author
      - institution
      - publication_reference
      - last_updated
      - validation_status

  ImagingProtocol:
    is_a: Protocol
    description: >-
      Protocol for imaging-based assays (CBF, ASL, MCC). Captures frame rate,
      duration, resolution, and tracer/labeling details.
    slots:
      - imaging_frame_rate
      - imaging_duration
      - spatial_resolution
      - fluorescent_labeling
      - fluorescent_tracer
      - evaporation_prevention
      - particle_tracking_method
      - temperature_control
      - humidity_control
      - particle_size

  StainingProtocol:
    is_a: Protocol
    description: >-
      Protocol for staining-based assays (goblet cell, immunofluorescence).
      Captures staining type, antibodies, fixation, and detection details.
    slots:
      - staining_type
      - antibodies_used
      - detection_method
      - normalization_method
      - fixation_method
      - counterstain

  SpirometryProtocol:
    is_a: Protocol
    description: >-
      Protocol for lung function / spirometry assays. Captures spirometry
      standards, bronchodilator details, and plethysmography method.
    slots:
      - spirometry_standard
      - bronchodilator_agent
      - bronchodilator_dose
      - plethysmography_method

  MolecularAssayProtocol:
    is_a: Protocol
    description: >-
      Protocol for molecular biology assays (qRT-PCR, Western blot, ELISA).
      Captures detection method, normalization, primers, and platform details.
    slots:
      - detection_method
      - normalization_method
      - antibodies_used
      - primer_sequences
      - reference_gene
      - lysis_buffer
      - platform

  # ---------------------------------------------------------------------------
  # Supporting Value Classes
  # ---------------------------------------------------------------------------

  QuantityValue:
    description: >-
      A quantity with a numeric value and unit of measurement.
      Used for all measurement values in assays. Optionally records
      what kind of central value this is (mean, median, single
      measurement), the reported variability around it (SD, SEM,
      confidence interval, range), and the number of subjects or
      replicates behind it. Keeping variability separate from the
      central value lets downstream analyses use each independently.
    slots:
      - value
      - unit
      - central_tendency
      - variability
      - sample_size

  Variability:
    description: >-
      The reported spread or uncertainty around a measured value, kept
      separate from the value itself because papers report it in
      different forms. Use variability_type to say what was reported
      (standard deviation, standard error, confidence interval, range)
      and either a single magnitude (value) or bounds
      (lower_bound/upper_bound), with a unit when it differs from the
      measurement's unit.
    slots:
      - variability_type
      - value
      - lower_bound
      - upper_bound
      - unit

  Unit:
    description: >-
      A unit of measurement from a standard ontology (UO, UCUM, QUDT, STATO).
    slots:
      - id
      - name
    id_prefixes:
      - UO
      - UCUM
      - QUDT
      - STATO
    slot_usage:
      id:
        pattern: "^(UO:\\d{7}|UCUM:\\S+|QUDT:\\S+|STATO:\\d{7})$"

  NamedEntity:
    description: >-
      A reference to an entity with an identifier and name.
      Used for cell_type, tissue_context, participant references, etc.
    slots:
      - id
      - name

  CellTypeReference:
    is_a: NamedEntity
    description: >-
      A reference to a cell type from the Cell Ontology (CL).
    id_prefixes:
      - CL
    slot_usage:
      id:
        pattern: "^CL:\\d{7}$"

  SpeciesReference:
    is_a: NamedEntity
    description: >-
      A reference to a species from the NCBI Taxonomy.
    id_prefixes:
      - NCBITaxon
    slot_usage:
      id:
        pattern: "^NCBITaxon:\\d+$"

  ChemicalEntityReference:
    is_a: NamedEntity
    description: >-
      A reference to a chemical entity from CHEBI or an exposure
      concept from ECTO.
    id_prefixes:
      - CHEBI
      - ECTO
    slot_usage:
      id:
        pattern: "^(CHEBI:\\d+|ECTO:\\d{7})$"

  AnatomicalEntityReference:
    is_a: NamedEntity
    description: >-
      A reference to an anatomical entity from UBERON.
    id_prefixes:
      - UBERON
    slot_usage:
      id:
        pattern: "^UBERON:\\d{7}$"

  # ---------------------------------------------------------------------------
  # Exposure Condition Class
  # ---------------------------------------------------------------------------

  ExposureCondition:
    is_a: NamedEntity
    description: >-
      A structured description of an exposure or treatment applied to a
      biological system. Captures what agent was applied, at what concentration,
      for how long, and when the measurement was taken relative to exposure.
    slots:
      - exposure_agent
      - exposure_concentration
      - exposure_duration
      - timing_post_exposure

  # ---------------------------------------------------------------------------
  # Response Comparison (Analysis Layer)
  # ---------------------------------------------------------------------------

  ResponseComparison:
    is_a: NamedThing
    description: >-
      An analysis-layer record describing the change in a measured response
      between a control/baseline group and a treated group. Lives alongside
      the extracted assay data rather than inside it: papers report changes
      in many forms (absolute difference, percent change, fold change,
      ratio), and downstream models need a single change value with an
      uncertainty measure. References the control and treated output
      records by id, names the measurement being compared, and states the
      kind, direction, and size of the change. Use derivation to record
      whether the change was reported in the paper or computed afterwards.
    slots:
      - derived_from_assay
      - compared_measurement
      - control_output
      - treated_output
      - change_type
      - change_direction
      - change_value
      - p_value
      - statistical_test
      - derivation

  # ---------------------------------------------------------------------------
  # Cell Culture Model System Classes
  # ---------------------------------------------------------------------------

  CellularSystem:
    is_a: ModelSystem
    description: >-
      Cell-based model systems that use living cells to model biological
      processes.
    slots:
      # Cell identity
      - cell_line
      - primary_cell
      - cell_type
      - anatomical_origin
      # Culture properties
      - cell_culture_growth_mode
      - substrate_type
      - confluence_level
      - passage_number
      - seeding_density
      - coating
      - matrix_composition
      - size_range
      - organoid_type
      - cell_type_ratios
      - culture_conditions
      - culture_media
      # Subject info (moved from Assay base)
      - days_at_differentiation
      - donor_info
      - replicates_per_donor

  # ---------------------------------------------------------------------------
  # Cell Culture Supporting Classes
  # ---------------------------------------------------------------------------

  CellLine:
    is_a: NamedEntity
    description: >-
      A cell line - a genetically stable cultured cell population.
    slots:
      - cell_type
      - model_species
      - tissue_origin
      - disease_state
      - supplier
      - catalog_number
      - authentication_method
      - mycoplasma_status
    id_prefixes:
      - CLO
    slot_usage:
      id:
        pattern: "^CLO:\\d{7}$"

  CellCultureConditions:
    is_a: NamedEntity
    exact_mappings:
      - CLO:0037334
    description: >-
      Detailed cell culture parameters including medium, environment, and timing.
    slots:
      - culture_media
      - days_at_air_liquid_interface
      - passage_number
      - substrate_type
      - cell_culture_growth_mode
      - donor_count
      - replicates_per_donor

  CellCultureMedium:
    is_a: NamedEntity
    description: >-
      Detailed formulation of cell culture medium including base medium
      and supplements.
    slots:
      - base_medium
      - serum_type
      - serum_concentration
      - supplements
      - osmolality
      - manufacturer
      - catalog_number
      - lot_number
      - preparation_date

  MediumSupplement:
    is_a: NamedEntity
    description: >-
      Supplement or additive to cell culture medium.
    slots:
      - supplement_type
      - concentration
      - manufacturer
      - catalog_number

  QuantityRange:
    description: >-
      A range of quantity values with minimum and maximum bounds.
    slots:
      - min_value
      - max_value
      - unit

# =============================================================================
# SLOTS
# =============================================================================

slots:

  # ---------------------------------------------------------------------------
  # AOP Connection Slot (CRITICAL NEW SLOT)
  # ---------------------------------------------------------------------------

  informs_on_key_event:
    description: >-
      The Key Event that this assay provides evidence for. This establishes
      the mechanistic connection between the assay measurements and the
      Adverse Outcome Pathway framework. Multiple assays can inform on the
      same key event, providing converging evidence.
    range: KeyEvent
    inlined: true

  # ---------------------------------------------------------------------------
  # Assay Output Slot
  # ---------------------------------------------------------------------------

  has_specified_output:
    description: >-
      The measurement results produced by this assay — the specified output
      of a planned process (OBI). Contains the domain-specific measurement
      values (e.g., beat frequency, cilia length for CiliaryFunctionAssay).
      Multivalued: one output record per experimental condition or group,
      so a control group and each treatment concentration in a
      dose-response series each get their own record (marked with
      experimental_group and linked to the exposure via measured_under).
    range: AssayOutputMeasurement
    exact_mappings:
      - OBI:0000299
    multivalued: true
    inlined_as_list: true

  experimental_group:
    description: >-
      The role of this output record's group in the experimental design:
      control, vehicle control, baseline, treated, recovery, or sham.
      Lets extraction distinguish the control/baseline response from the
      treated response so a change relative to control can be assembled
      downstream.
    range: ExperimentalGroupEnum

  measured_under:
    description: >-
      Reference (by id) to the specific ExposureCondition this output
      record was measured under. Links each set of response values to the
      concentration/treatment it corresponds to, so a dose-response series
      keeps each response paired with its exposure level. The referenced
      condition should be listed in the assay's has_exposure_condition.
    range: ExposureCondition
    inlined: false

  # ---------------------------------------------------------------------------
  # Context Slots
  # ---------------------------------------------------------------------------

  cell_type:
    description: >-
      The cell type being studied. Reference to a Cell Ontology (CL) term.
      Used on CellularSystem and CellLine to describe the cell identity.
    range: CellTypeReference
    inlined: true
    slot_uri: EFO:0000324

  target_cell_type:
    description: >-
      The specific cell type that is the primary focus of this assay's
      analysis, when the assay examines multiple cell populations in a
      sample (e.g., neutrophils in a BALF differential).
    range: CellTypeReference
    inlined: true

  model_species:
    description: >-
      The species of origin for the cells or organism being studied.
      Reference to NCBITaxon term.
    range: SpeciesReference
    inlined: true

  # ---------------------------------------------------------------------------
  # Study Subject Slots
  # ---------------------------------------------------------------------------

  subject_type:
    description: >-
      The specific type of study subject. Used to designate which concrete
      class (e.g., CellularSystem, InVivoSubject) is instantiated for
      polymorphic study_subject slots.
    designates_type: true
    range: string

  study_subject:
    description: >-
      The subject of the study — what the assay is performed on. Can be a
      ModelSystem (e.g., CellularSystem), an InVivoSubject, or a
      PopulationSubject. The type of subject determines which context
      slots are available.
    range: StudySubject
    inlined: true

  sample_collection_method:
    description: >-
      Method used for sample collection in vivo (e.g., bronchoscopy,
      induced sputum, spirometry).
    range: string

  clinical_context:
    description: >-
      Clinical context for in vivo measurements (e.g., routine screening,
      post-exposure assessment, disease monitoring, baseline spirometry).
    range: string

  # ---------------------------------------------------------------------------
  # Test System Slots
  # ---------------------------------------------------------------------------

  has_exposure_condition:
    description: >-
      The exposure condition(s) applied to the study subject. Captures the
      agent, concentration, duration, and timing of exposure/treatment.
      Multivalued to support co-exposures or dose-response series.
    range: ExposureCondition
    multivalued: true
    inlined_as_list: true

  # ---------------------------------------------------------------------------
  # Methodology Slots
  # ---------------------------------------------------------------------------

  protocol_type:
    description: >-
      The specific type of protocol. Used to designate which concrete
      class (e.g., ImagingProtocol, StainingProtocol, SpirometryProtocol,
      MolecularAssayProtocol) is instantiated for polymorphic protocol slots.
    designates_type: true
    range: string

  follows_protocols:
    description: >-
      The Protocol(s) that this assay follows. Any Protocol or Protocol
      subclass (ImagingProtocol, StainingProtocol, SpirometryProtocol,
      MolecularAssayProtocol) is valid. Use this for general protocol
      references; assay subclasses also have typed protocol slots for
      domain-specific protocols.
    range: Protocol
    multivalued: true
    inlined_as_list: true

  sub_protocols:
    description: >-
      Other protocols that are part of this protocol's workflow. Use this
      to compose protocols from reusable steps (e.g., sample preparation,
      wash steps, fixation, post-processing). Any Protocol or Protocol
      subclass is valid.
    range: Protocol
    multivalued: true
    inlined_as_list: true

  # ---------------------------------------------------------------------------
  # Sample/Subject Info Slots (now on CellularSystem)
  # ---------------------------------------------------------------------------

  days_at_differentiation:
    description: >-
      Days at air-liquid interface or differentiation stage.
    range: integer

  donor_info:
    description: >-
      Information about cell donor (e.g., healthy non-smoker, CF patient,
      age, anatomical region).
    range: string

  replicates_per_donor:
    description: >-
      Number of biological replicates per donor.
    range: integer

  # ---------------------------------------------------------------------------
  # Timing Slots
  # ---------------------------------------------------------------------------

  assay_date:
    description: >-
      Date when the assay was performed.
    range: date

  # ---------------------------------------------------------------------------
  # InVivoSubject Slots
  # ---------------------------------------------------------------------------

  age:
    description: >-
      Age of the subject.
    range: QuantityValue
    inlined: true

  sex:
    description: >-
      Biological sex of the subject.
    range: string

  subject_characteristics:
    description: >-
      Relevant subject characteristics (disease state, medications, etc.).
      TIER 1 for LungFunctionAssay per user feedback.
    range: string

  sample_type:
    description: Type of biological sample (e.g., sputum, BALF, blood).
    range: SampleTypeEnum

  collection_site:
    description: Anatomical site of sample collection.
    range: string

  collection_date:
    description: Date when the sample was collected.
    range: date

  # ---------------------------------------------------------------------------
  # PopulationSubject Slots
  # ---------------------------------------------------------------------------

  cohort_size:
    description: >-
      Number of subjects in the cohort or population.
    range: integer

  inclusion_criteria:
    description: >-
      Criteria for inclusion in the study population.
    range: string

  age_range:
    description: >-
      Age range of the study population.
    range: QuantityRange
    inlined: true

  subjects:
    description: >-
      Individual subjects in the population or cohort. Optional — use when
      individual-level data is available alongside aggregate cohort metadata.
    range: InVivoSubject
    multivalued: true
    inlined_as_list: true

  # ---------------------------------------------------------------------------
  # Protocol Detail Slots (Tier 2/3)
  # ---------------------------------------------------------------------------

  protocol_version:
    description: Version of the protocol.
    range: string

  sop_reference:
    description: Reference to standard operating procedure document.
    range: string

  imaging_frame_rate:
    description: Frame rate for video/imaging acquisition (e.g., 200 fps).
    range: QuantityValue
    inlined: true

  imaging_duration:
    description: Duration of imaging session.
    range: QuantityValue
    inlined: true

  spatial_resolution:
    description: Spatial resolution of imaging (e.g., 1-2 um axial resolution).
    range: QuantityValue
    inlined: true

  temperature_control:
    description: Temperature conditions during the procedure (e.g., 37C).
    range: QuantityValue
    inlined: true

  humidity_control:
    description: Humidity conditions during the procedure.
    range: QuantityValue
    inlined: true

  evaporation_prevention:
    description: Method used to prevent evaporation (e.g., perfluorocarbon overlay).
    range: string

  fluorescent_labeling:
    description: Fluorescent label or tracer used.
    range: string

  fluorescent_tracer:
    description: Fluorescent tracer used for tracking (MCC assays).
    range: string

  particle_tracking_method:
    description: Method used for tracking particles or mucus.
    range: string

  particle_size:
    description: Size of tracking particles.
    range: QuantityValue
    inlined: true

  spirometry_standard:
    description: Spirometry standard followed (e.g., ATS/ERS 2019).
    range: string

  bronchodilator_agent:
    description: Bronchodilator agent used (e.g., albuterol).
    range: string

  bronchodilator_dose:
    description: Dose of bronchodilator administered.
    range: QuantityValue
    inlined: true

  plethysmography_method:
    description: Method for plethysmography measurement.
    range: string

  detection_method:
    description: Detection method used (e.g., flow cytometry, plate reader).
    range: string

  staining_type:
    description: Type of staining used (e.g., immunofluorescence, AB-PAS).
    range: string

  antibodies_used:
    description: Antibodies used in staining or detection.
    range: string
    multivalued: true

  normalization_method:
    description: Method used for data normalization.
    range: string

  quality_control_criteria:
    description: Quality control acceptance criteria.
    range: string

  replicate_requirements:
    description: Number of replicates required.
    range: integer

  protocol_author:
    description: Author of the protocol.
    range: string

  institution:
    description: Institution where protocol was developed.
    range: string

  publication_reference:
    description: Reference to protocol publication.
    range: string

  last_updated:
    description: Date protocol was last updated.
    range: date

  validation_status:
    description: Validation status of the protocol.
    range: string

  fixation_method:
    description: Fixation method used for tissue/cell preparation.
    range: string

  counterstain:
    description: Counterstain used (e.g., hematoxylin, DAPI).
    range: string

  primer_sequences:
    description: Primer sequences used for PCR-based methods.
    range: string
    multivalued: true

  reference_gene:
    description: Reference/housekeeping gene used for normalization.
    range: string

  lysis_buffer:
    description: Lysis buffer used for sample preparation.
    range: string

  platform:
    description: Assay platform or instrument used (e.g., QuantStudio, Illumina).
    range: string

  # ---------------------------------------------------------------------------
  # Protocol Equipment Slots
  # ---------------------------------------------------------------------------

  equipment_required:
    description: Equipment required for this protocol.
    range: string
    multivalued: true

  key_reagents:
    description: Key reagents needed for this protocol.
    range: string
    multivalued: true

  general_procedure:
    description: High-level description of the procedure.
    range: string

  obi_mapping:
    description: OBI ontology term for this method.
    range: uriorcurie

  # ---------------------------------------------------------------------------
  # Exposure Condition Slots
  # ---------------------------------------------------------------------------

  exposure_agent:
    description: >-
      The chemical, biological, or environmental agent used for exposure
      or treatment. Reference to a CHEBI or ECTO ontology term.
    range: ChemicalEntityReference
    inlined: true

  exposure_duration:
    description: Duration of exposure or treatment.
    range: QuantityValue
    inlined: true

  exposure_concentration:
    description: Concentration of the exposure agent applied.
    range: QuantityValue
    inlined: true

  timing_post_exposure:
    description: >-
      Time after exposure when the measurement was taken. Used to capture
      the temporal relationship between exposure and assay readout.
    range: QuantityValue
    inlined: true

  # ---------------------------------------------------------------------------
  # Cell Culture Slots
  # ---------------------------------------------------------------------------

  cell_line:
    range: CellLine
    inlined: true

  primary_cell:
    range: CellTypeReference
    inlined: true

  anatomical_origin:
    range: AnatomicalEntityReference
    inlined: true

  cell_culture_growth_mode:
    range: CellCultureGrowthModeEnum

  culture_conditions:
    range: CellCultureConditions
    inlined: true

  culture_media:
    range: CellCultureMedium
    inlined: true

  substrate_type:
    range: SubstrateTypeEnum

  passage_number:
    range: integer

  days_at_air_liquid_interface:
    range: integer

  donor_count:
    range: integer

  confluence_level:
    range: QuantityValue
    inlined: true

  seeding_density:
    range: QuantityValue
    inlined: true

  coating:
    range: string


  matrix_composition:
    range: string

  size_range:
    range: QuantityRange
    inlined: true

  organoid_type:
    range: string

  cell_type_ratios:
    range: string
    multivalued: true

  # ---------------------------------------------------------------------------
  # Cell Line Detail Slots
  # ---------------------------------------------------------------------------

  tissue_origin:
    range: string

  disease_state:
    range: string

  supplier:
    range: string

  catalog_number:
    range: string

  authentication_method:
    range: string

  mycoplasma_status:
    range: string

  # ---------------------------------------------------------------------------
  # Medium Slots
  # ---------------------------------------------------------------------------

  base_medium:
    range: string

  serum_type:
    range: string

  serum_concentration:
    range: QuantityValue
    inlined: true

  supplements:
    range: MediumSupplement
    multivalued: true
    inlined_as_list: true

  osmolality:
    range: QuantityValue
    inlined: true

  manufacturer:
    range: string

  lot_number:
    range: string

  preparation_date:
    range: date

  supplement_type:
    range: SupplementTypeEnum

  concentration:
    range: QuantityValue
    inlined: true

  # ---------------------------------------------------------------------------
  # QuantityValue and Range Slots
  # ---------------------------------------------------------------------------

  value:
    description: The numeric value of the quantity.
    range: string

  unit:
    description: The unit of measurement.
    range: Unit
    inlined: true

  central_tendency:
    description: >-
      What kind of central value the reported number is: a mean, median,
      geometric mean, or a single measurement. Important for combining
      results across studies.
    range: CentralTendencyEnum

  variability:
    description: >-
      The reported variability around the value (SD, SEM, confidence
      interval, or range), kept separate from the central value itself.
    range: Variability
    inlined: true

  sample_size:
    description: >-
      Number of subjects, samples, or replicates behind this value.
    range: integer

  variability_type:
    description: >-
      The kind of variability reported (standard deviation, standard
      error, 95% confidence interval, range, interquartile range).
    range: VariabilityTypeEnum

  lower_bound:
    description: >-
      Lower bound when variability is reported as an interval
      (confidence interval, range, IQR).
    range: string

  upper_bound:
    description: >-
      Upper bound when variability is reported as an interval
      (confidence interval, range, IQR).
    range: string

  min_value:
    range: QuantityValue
    inlined: true

  max_value:
    range: QuantityValue
    inlined: true

  # ---------------------------------------------------------------------------
  # Response Comparison Slots (Analysis Layer)
  # ---------------------------------------------------------------------------

  derived_from_assay:
    description: >-
      Reference (by id) to the assay whose output records this comparison
      is derived from.
    range: Assay
    inlined: false

  compared_measurement:
    description: >-
      The name of the measurement slot being compared (e.g.,
      "total_lung_capacity", "beat_frequency_hz"), matching the slot name
      in the referenced output records.
    range: string

  control_output:
    description: >-
      Reference (by id) to the AssayOutputMeasurement record for the
      control or baseline group.
    range: AssayOutputMeasurement
    inlined: false

  treated_output:
    description: >-
      Reference (by id) to the AssayOutputMeasurement record for the
      treated group.
    range: AssayOutputMeasurement
    inlined: false

  change_type:
    description: >-
      How the change is expressed: an absolute difference, a percent
      change, a fold change, or a ratio. Papers report changes in
      different forms; this makes the form explicit so values can be
      compared or converted downstream.
    range: ChangeTypeEnum

  change_direction:
    description: >-
      Direction of the change in the treated group relative to control.
    range: ChangeDirectionEnum

  change_value:
    description: >-
      The size of the change, with its unit and (when reported) its
      uncertainty. For a percent change the unit is percent; for an
      absolute difference it is the measurement's unit; fold changes and
      ratios are dimensionless.
    range: QuantityValue
    inlined: true

  p_value:
    description: >-
      Reported p-value for the comparison, when available.
    range: float

  statistical_test:
    description: >-
      Statistical test used for the comparison (e.g., t-test, ANOVA),
      when reported.
    range: string

  derivation:
    description: >-
      Whether this change was reported directly in the paper or computed
      afterwards from the extracted control and treated values.
    range: DerivationEnum

# =============================================================================
# ENUMS
# =============================================================================

enums:

  SampleTypeEnum:
    description: Types of biological samples for in vivo assays.
    permissible_values:
      urine:
        description: Urine sample
      blood:
        description: Blood sample
      sputum:
        description: Induced or spontaneous sputum
      balf:
        description: Bronchoalveolar lavage fluid
      nasal_epithelium:
        description: Nasal epithelial sample
      bronchial_epithelium:
        description: Bronchial epithelial sample
      exhaled_breath_condensate:
        description: Exhaled breath condensate
      biopsy:
        description: Tissue biopsy
      sweat:
        description: Sweat sample

  CellCultureGrowthModeEnum:
    description: Cell culture growth modes.
    permissible_values:
      adherent:
        description: Cells grow attached to a surface
        meaning: CLO:0000028
      suspension:
        description: Cells grow suspended in culture medium
        meaning: CLO:0000029
      air_liquid_interface:
        description: Cells cultured at air-liquid interface (ALI)
        meaning: OBI:0600047
      three_dimensional:
        description: Cells grown in 3D matrix or scaffold
      organoid:

        description: Self-organizing 3D tissue culture
      spheroid:
        description: Spherical cellular aggregates

  SubstrateTypeEnum:
    description: Types of cell culture substrates.
    permissible_values:
      plastic:
        description: Standard tissue culture-treated plastic
      collagen_coated:
        description: Collagen-coated surface
      matrigel:
        description: Basement membrane matrix
      fibronectin_coated:
        description: Fibronectin-coated surface
      laminin_coated:
        description: Laminin-coated surface
      transwell_insert:
        description: Permeable support for ALI culture
      hydrogel:
        description: Three-dimensional hydrogel matrix
      glass:
        description: Glass surface or coverslip
      pdms:
        description: Polydimethylsiloxane (microfluidics)

  SupplementTypeEnum:
    description: Categories of cell culture medium supplements.
    permissible_values:
      growth_factor:
        description: Proteins that stimulate cell growth
        meaning: CHEBI:23924
      antibiotic:
        description: Antimicrobial substances
        meaning: CHEBI:33281
      antifungal:
        description: Antifungal agents
        meaning: CHEBI:35718
      hormone:
        description: Signaling molecules
        meaning: CHEBI:24621
      vitamin:
        description: Essential vitamins
        meaning: CHEBI:33229
      amino_acid:
        description: Amino acid supplements
        meaning: CHEBI:33709
      lipid:
        description: Lipid supplements
        meaning: CHEBI:18059
      trace_element:
        description: Essential trace elements
      attachment_factor:
        description: Factors promoting cell attachment
      differentiation_factor:
        description: Factors promoting cell differentiation

  # ---------------------------------------------------------------------------
  # Assay Context Capability Enum
  # ---------------------------------------------------------------------------

  ExperimentalGroupEnum:
    description: >-
      The role of an experimental group in a study design, used to mark
      each per-condition output record.
    permissible_values:
      control:
        description: Untreated or unexposed control group
      vehicle_control:
        description: Control group receiving the vehicle/carrier only
      baseline:
        description: Pre-exposure or pre-treatment measurement of the same subjects
      treated:
        description: Group receiving the exposure or treatment
      recovery:
        description: Post-exposure recovery period measurement
      sham:
        description: Sham-treated control group

  CentralTendencyEnum:
    description: >-
      What kind of central value a reported number represents.
    permissible_values:
      mean:
        description: Arithmetic mean
      median:
        description: Median
      geometric_mean:
        description: Geometric mean
      single_value:
        description: A single measurement, not an aggregate

  VariabilityTypeEnum:
    description: >-
      Kinds of variability or uncertainty reported around a value.
    permissible_values:
      standard_deviation:
        description: Standard deviation (SD)
      standard_error:
        description: Standard error of the mean (SEM)
      confidence_interval_95:
        description: 95% confidence interval
      confidence_interval_other:
        description: Confidence interval at a level other than 95%
      range:
        description: Minimum-maximum range of observed values
      interquartile_range:
        description: Interquartile range (IQR)

  ChangeTypeEnum:
    description: >-
      Forms in which a change relative to control can be expressed.
    permissible_values:
      absolute_difference:
        description: Treated minus control, in the measurement's own unit
      percent_change:
        description: Change as a percentage of the control value
      fold_change:
        description: Treated divided by control, expressed as fold
      ratio:
        description: Ratio of treated to control

  ChangeDirectionEnum:
    description: >-
      Direction of a change in the treated group relative to control.
    permissible_values:
      increased:
        description: Treated value is higher than control
      decreased:
        description: Treated value is lower than control
      no_change:
        description: No meaningful difference from control

  DerivationEnum:
    description: >-
      Provenance of an analysis-layer value.
    permissible_values:
      reported_in_paper:
        description: The value was stated directly in the publication
      computed:
        description: The value was calculated from extracted values

  AssayContextCapabilityEnum:
    description: >-
      Indicates what experimental contexts an assay class supports.
      Used to constrain valid study_subject types and enable
      context-appropriate slots.
    permissible_values:
      in_vitro_only:
        description: >-
          Assay can only be performed in vitro (cell cultures, tissue slices,
          organoids, etc.)
      in_vivo_only:
        description: >-
          Assay can only be performed in vivo (requires samples from or
          measurements on living human or animal subjects)
      in_vitro_or_in_vivo:
        description: >-
          Assay can be performed in either in vitro or in vivo contexts
          depending on the experimental design
